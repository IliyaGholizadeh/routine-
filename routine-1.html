<style>
  :root {
    --bg0: #030714;
    --bg1: #081030;
    --bg2: #0f1d4d;
    --card: rgba(22, 38, 92, 0.34);
    --card-edge: rgba(130, 165, 255, 0.15);
    --accent: #7ea3ff;
    --accent-deep: #4a76f0;
    --text: #e9eeff;
    --muted: #8c99c6;
    --faint: rgba(140, 153, 198, 0.55);
    --radius: 22px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 100% 0%, rgba(40, 70, 170, 0.45), transparent 60%),
      radial-gradient(800px 600px at 0% 100%, rgba(30, 55, 150, 0.40), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg0) 55%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* decorative math marks */
  .deco { position: fixed; pointer-events: none; color: rgba(126, 163, 255, 0.09); font-family: Georgia, serif; user-select: none; }
  .deco.a { top: 70px; right: 6%; font-size: 64px; }
  .deco.b { top: 18%; left: 8%; font-size: 72px; }
  .deco.c { bottom: 14%; left: 4%; font-size: 60px; }
  .deco.d { bottom: 10%; right: 7%; font-size: 52px; }
  .deco.ring {
    width: 420px; height: 420px; border-radius: 50%;
    border: 1px solid rgba(126, 163, 255, 0.10);
    top: -190px; left: -150px;
  }

  .wrap { position: relative; max-width: 1040px; margin: 0 auto; padding: calc(44px + env(safe-area-inset-top)) 24px calc(80px + env(safe-area-inset-bottom)); }

  header { margin-bottom: 30px; }
  h1 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.2px;
    display: inline-block; outline: none; border-radius: 8px; padding: 0 6px; margin-right: -6px;
    cursor: text;
  }
  h1:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .divider { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; width: 100px; }
  .divider i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(126,163,255,.5)); }
  .divider i:last-child { transform: scaleX(-1); }
  .divider b { width: 6px; height: 6px; background: var(--accent); transform: rotate(45deg); }
  .date-main { font-size: 17px; color: #c3cff5; font-weight: 500; }
  .date-sub { font-size: 13px; color: var(--muted); margin-top: 3px; direction: ltr; text-align: right; }
  .tagline { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 22px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    padding: 20px 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px rgba(0, 0, 8, 0.35);
  }

  /* category */
  .cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cat-icon {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #1e3a9a, #14246a);
    border: 1px solid rgba(126,163,255,.25);
    color: #cfe0ff;
  }
  .cat-icon svg { width: 18px; height: 18px; }
  .cat-name { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; outline: none; border-radius: 6px; padding: 2px 4px; }
  .cat-name:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .cat-count { font-size: 13px; color: var(--muted); }
  .icon-btn {
    background: none; border: 0; color: var(--faint); cursor: pointer;
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    transition: color .15s, background .15s;
  }
  .icon-btn:hover { color: #ff9aa8; background: rgba(255,255,255,.05); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); }
  .icon-btn svg { width: 15px; height: 15px; }

  ul { list-style: none; }
  .task { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .task label { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; min-width: 0; }
  .task input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    width: 22px; height: 22px; border-radius: 7px; flex: none;
    border: 1.5px solid rgba(140,153,198,.45);
    display: grid; place-items: center;
    transition: background .18s, border-color .18s, transform .18s;
  }
  .box svg { width: 13px; height: 13px; stroke: #07102e; opacity: 0; transform: scale(.5); transition: opacity .18s, transform .18s; }
  .task input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .task input:checked + .box svg { opacity: 1; transform: scale(1); }
  .task input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .task:active .box { transform: scale(.92); }
  .label-text { font-size: 15px; color: #f1f4ff; overflow-wrap: anywhere; transition: color .2s; }
  .task input:checked ~ .label-text { color: var(--muted); }
  .time {
    flex: none; width: 96px; direction: ltr; text-align: center;
    font: inherit; font-size: 13px; color: #cfdbff;
    background: rgba(126,163,255,.10);
    border: 1px solid rgba(126,163,255,.18); border-radius: 10px;
    padding: 5px 6px; cursor: pointer; outline: none;
    transition: background .15s, border-color .15s, color .15s;
  }
  .time:hover { background: rgba(126,163,255,.18); }
  .time:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(126,163,255,.25); }
  .time.unset { color: var(--faint); background: transparent; border-style: dashed; }
  .time::-webkit-calendar-picker-indicator { filter: invert(.8) sepia(1) saturate(3) hue-rotate(190deg); cursor: pointer; margin-left: 2px; }
  .task.done-task .time { opacity: .55; }
  .add-row input.time { flex: none; width: 104px; padding: 9px 8px; border-radius: 12px; }
  .task .icon-btn { opacity: .6; }
  .task:hover .icon-btn, .task .icon-btn:focus-visible { opacity: 1; }

  .empty { font-size: 13px; color: var(--muted); padding: 6px 0 10px; }

  .add-row { display: flex; gap: 8px; margin-top: 10px; padding-top: 14px; border-top: 1px solid rgba(126,163,255,.10); }
  .add-row input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text);
    background: rgba(5, 10, 36, .45);
    border: 1px solid rgba(126,163,255,.16); border-radius: 12px; padding: 9px 12px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .add-row input::placeholder { color: var(--faint); }
  .add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(126,163,255,.15); }
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    color: #07102e; background: var(--accent); border: 0; border-radius: 12px; padding: 0 16px;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: #9bb8ff; }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .new-cat {
    display: flex; gap: 8px; padding: 14px 16px;
    border: 1px dashed rgba(126,163,255,.28); border-radius: var(--radius);
  }
  .new-cat input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text);
    background: transparent; border: 0; outline: none; padding: 6px 4px;
  }
  .new-cat input::placeholder { color: var(--muted); }
  .new-cat:focus-within { border-color: var(--accent); }
  .btn.ghost { background: rgba(126,163,255,.14); color: var(--accent); }
  .btn.ghost:hover { background: rgba(126,163,255,.24); }

  /* progress */
  .progress { position: sticky; top: 24px; }
  .p-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: .2px; color: #dbe4ff; }
  .p-title svg { width: 16px; height: 16px; color: var(--accent); }
  .ring-wrap { position: relative; width: 240px; height: 240px; margin: 14px auto 18px; }
  .ring-wrap svg { width: 100%; height: 100%; display: block; }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .pct { font-size: 50px; font-weight: 300; line-height: 1.1; }
  .pct-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .bar { height: 6px; border-radius: 99px; background: rgba(140,153,198,.18); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(270deg, var(--accent), var(--accent-deep)); transition: width .5s cubic-bezier(.3,.7,.2,1); }
  .note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; min-height: 20px; }

  .ring-track { stroke: rgba(140,153,198,.16); }
  .ring-fill { stroke: var(--accent); transition: stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1); }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
    .progress { position: static; order: -1; }
    .wrap { padding: calc(28px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); }
    .deco { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  <div class="wrap">
    <header>

            <div class="ring-center">
              <div class="pct" id="pct">۰٪</div>
              <div class="pct-sub" id="pctSub">۰ از ۰ انجام شد</div>
            </div>
          </div>
          <div class="bar"><span id="barFill"></span></div>
          <div class="note" id="note"></div>
        </section>
      </aside>
    </div>
  </div>

<script>
(function () {
  var STORE_KEY = "routine-app-v1";
  var C = 2 * Math.PI * 84;

  var fa = function (n) { return Number(n).toLocaleString("fa-IR"); };
  var uid = function () { return Math.random().toString(36).slice(2, 9); };

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  /* ---------- state ---------- */
  var defaultState = {
    title: "روتین من",
    cats: [
      { id: uid(), name: "بدن", icon: "star", tasks: [
        { id: uid(), text: "ورزش + باشگاه" },
        { id: uid(), text: "تغذیه + آب + خواب" },
        { id: uid(), text: "مدیتیشن" }
      ]},
      { id: uid(), name: "آموزش", icon: "book", tasks: [
        { id: uid(), text: "مطالعه ریاضی" },
        { id: uid(), text: "مطالعه فیزیک" },
        { id: uid(), text: "مطالعه شیمی" },
        { id: uid(), text: "آزمون + سایر" }
      ]}
    ],
    done: {}   // { "2026-11-20": [taskId, ...] }
  };

  var state;
  var memoryFallback = null;
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return memoryFallback || JSON.parse(JSON.stringify(defaultState));
  }
  function save() {
    memoryFallback = state;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  state = load();

  function doneToday() {
    var k = todayKey();
    if (!state.done[k]) state.done[k] = [];
    return state.done[k];
  }
  function pruneOldDays() {
    var keys = Object.keys(state.done).sort();
    while (keys.length > 60) delete state.done[keys.shift()];
  }

  /* ---------- date header ---------- */
  var currentDayShown = "";
  function renderDate() {
    var now = new Date();
    document.getElementById("dateFa").textContent =
      new Intl.DateTimeFormat("fa-IR-u-ca-persian", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
    document.getElementById("dateEn").textContent =
      new Intl.DateTimeFormat("en-US", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
    currentDayShown = todayKey();
  }

  /* ---------- icons ---------- */
  var ICONS = {
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    book: '<path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'
  };
  function svg(inner, cls) {
    return '<svg ' + (cls ? 'class="' + cls + '" ' : '') + 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  var TRASH = svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>');
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  /* ---------- render ---------- */
  var catsEl = document.getElementById("cats");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var done = doneToday();
    catsEl.innerHTML = "";

    state.cats.forEach(function (cat) {
      var card = el("section", "card");
      card.setAttribute("aria-label", cat.name);

      var head = el("div", "cat-head");
      var ic = el("div", "cat-icon");
      ic.innerHTML = svg(ICONS[cat.icon] || ICONS.list);
      var name = el("div", "cat-name", cat.name);
      name.contentEditable = "true";
      name.spellcheck = false;
      name.title = "برای تغییر نام کلیک کنید";
      name.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); name.blur(); } });
      name.addEventListener("blur", function () {
        var v = name.textContent.trim();
        cat.name = v || cat.name;
        name.textContent = cat.name;
        save();
      });
      var count = el("div", "cat-count");
      var delCat = el("button", "icon-btn");
      delCat.type = "button";
      delCat.setAttribute("aria-label", "حذف بخش " + cat.name);
      delCat.innerHTML = TRASH;
      delCat.addEventListener("click", function () {
        if (!confirm("بخش «" + cat.name + "» و همه تسک‌هایش حذف شود؟")) return;
        state.cats = state.cats.filter(function (c) { return c.id !== cat.id; });
        save(); render();
      });
      head.append(ic, name, count, delCat);
      card.appendChild(head);

      var list = el("ul");
      var doneCount = 0;
      cat.tasks.forEach(function (t) {
        var isDone = done.indexOf(t.id) !== -1;
        if (isDone) doneCount++;
        var li = el("li", "task");
        var label = el("label");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = isDone;
        var box = el("span", "box");
        box.innerHTML = CHECK;
        var txt = el("span", "label-text", t.text);
        label.append(cb, box, txt);
        cb.addEventListener("change", function () {
          var arr = doneToday();
          var i = arr.indexOf(t.id);
          if (cb.checked && i === -1) arr.push(t.id);
          if (!cb.checked && i !== -1) arr.splice(i, 1);
          save();
          updateCounts();
        });
        var del = el("button", "icon-btn");
        del.type = "button";
        del.setAttribute("aria-label", "حذف تسک " + t.text);
        del.innerHTML = TRASH;
        del.addEventListener("click", function () {
          cat.tasks = cat.tasks.filter(function (x) { return x.id !== t.id; });
          save(); render();
        });
        var tm = document.createElement("input");
        tm.type = "time";
        tm.className = "time" + (t.time ? "" : " unset");
        tm.value = t.time || "";
        tm.setAttribute("aria-label", "ساعت تسک " + t.text);
        tm.title = "تعیین ساعت";
        tm.addEventListener("change", function () {
          t.time = tm.value || "";
          tm.classList.toggle("unset", !tm.value);
          save();
        });
        li.append(label, tm, del);
        list.appendChild(li);
      });
      if (!cat.tasks.length) list.appendChild(el("li", "empty", "هنوز تسکی اضافه نشده."));
      card.appendChild(list);

      var form = el("form", "add-row");
      var inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "تسک جدید...";
      inp.maxLength = 80;
      inp.setAttribute("aria-label", "تسک جدید برای " + cat.name);
      var newTime = document.createElement("input");
      newTime.type = "time";
      newTime.className = "time unset";
      newTime.setAttribute("aria-label", "ساعت تسک جدید (اختیاری)");
      newTime.title = "ساعت (اختیاری)";
      newTime.addEventListener("change", function () { newTime.classList.toggle("unset", !newTime.value); });
      var btn = el("button", "btn", "افزودن");
      btn.type = "submit";
      form.append(inp, newTime, btn);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = inp.value.trim();
        if (!v) return;
        cat.tasks.push({ id: uid(), text: v, time: newTime.value || "" });
        save(); render();
        // keep typing flow: refocus this category's input
        var inputs = catsEl.querySelectorAll(".add-row input");
        var idx = state.cats.indexOf(cat);
        if (inputs[idx]) inputs[idx].focus();
      });
      card.appendChild(form);

      card._count = count;
      card._doneCount = doneCount;
      card._total = cat.tasks.length;
      card.dataset.catId = cat.id;
      catsEl.appendChild(card);
    });

    // new category
    var nf = el("form", "new-cat");
    var ni = document.createElement("input");
    ni.type = "text";
    ni.placeholder = "بخش جدید (مثلاً: کار، مطالعه...)";
    ni.maxLength = 40;
    ni.setAttribute("aria-label", "نام بخش جدید");
    var nb = el("button", "btn ghost", "افزودن بخش");
    nb.type = "submit";
    nf.append(ni, nb);
    nf.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = ni.value.trim();
      if (!v) return;
      state.cats.push({ id: uid(), name: v, icon: "list", tasks: [] });
      save(); render();
    });
    catsEl.appendChild(nf);

    updateCounts();
  }

  /* ---------- progress ---------- */
  var ticksEl = document.getElementById("ticks");
  var NS = "http://www.w3.org/2000/svg";
  var TICKS = 60, tickNodes = [];
  for (var i = 0; i < TICKS; i++) {
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", "120"); ln.setAttribute("y1", "9");
    ln.setAttribute("x2", "120"); ln.setAttribute("y2", i % 5 === 0 ? "17" : "14");
    ln.setAttribute("transform", "rotate(" + (i * 360 / TICKS) + " 120 120)");
    ln.setAttribute("stroke-width", "1.4");
    ln.setAttribute("stroke-linecap", "round");
    ticksEl.appendChild(ln);
    tickNodes.push(ln);
  }

  var ringFill = document.getElementById("ringFill");
  ringFill.setAttribute("stroke-dasharray", C);

  function updateCounts() {
    var done = doneToday();
    var total = 0, completed = 0;

    state.cats.forEach(function (cat, idx) {
      var n = cat.tasks.length;
      var d = cat.tasks.filter(function (t) { return done.indexOf(t.id) !== -1; }).length;
      total += n; completed += d;
      var card = catsEl.querySelector('[data-cat-id="' + cat.id + '"]');
      if (card) card.querySelector(".cat-count").textContent = fa(d) + " / " + fa(n);
    });

    var pct = total ? Math.round(completed / total * 100) : 0;
    document.getElementById("pct").textContent = fa(pct) + "٪";
    document.getElementById("pctSub").textContent = fa(completed) + " از " + fa(total) + " انجام شد";
    ringFill.style.strokeDashoffset = C * (1 - (total ? completed / total : 0));
    document.getElementById("barFill").style.width = pct + "%";

    var lit = Math.round(TICKS * (total ? completed / total : 0));
    tickNodes.forEach(function (n, i) {
      n.setAttribute("stroke", i < lit ? "rgba(126,163,255,.75)" : "rgba(140,153,198,.28)");
    });

    var note = "";
    if (!total) note = "با افزودن اولین تسک شروع کن.";
    else if (completed === total) note = "امروز همه کارها انجام شد. دمت گرم!";
    else if (pct >= 50) note = "بیشتر راه رو رفتی، ادامه بده.";
    else if (completed === 0) note = "امروز هنوز شروع نشده.";
    document.getElementById("note").textContent = note;
  }

  /* ---------- title ---------- */
  var titleEl = document.getElementById("title");
  titleEl.textContent = state.title || "روتین من";
  titleEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); } });
  titleEl.addEventListener("blur", function () {
    var v = titleEl.textContent.trim();
    state.title = v || "روتین من";
    titleEl.textContent = state.title;
    save();
  });

  /* ---------- day rollover ---------- */
  function checkNewDay() {
    if (todayKey() !== currentDayShown) {
      renderDate();
      pruneOldDays();
      render();   // new day => all checkboxes start unchecked
    }
  }
  setInterval(checkNewDay, 30 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkNewDay(); });

  renderDate();
  render();
})();
</script>
</body>
</html>
